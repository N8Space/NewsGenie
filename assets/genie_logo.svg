<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98"/>
    </radialGradient>

    <!-- Neon Genie Energy Gradient -->
    <linearGradient id="neonVapor" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="40%" stop-color="#6366F1"/>
      <stop offset="80%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Lamp Body Gradient -->
    <linearGradient id="lampMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur2"/>
      <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Base Badge with Cyber Border -->
  <circle cx="60" cy="60" r="54" fill="url(#bgGrad)" stroke="url(#neonVapor)" stroke-width="2.5" filter="url(#softGlow)"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Mystic Energy Vapor / Futuristic Genie Smoke Silhouette -->
  <path d="M 60 22 
           C 70 20, 80 28, 76 38 
           C 73 47, 60 48, 66 58 
           C 71 66, 80 68, 70 77 
           C 62 83, 48 80, 52 68 
           C 56 57, 44 51, 46 39 
           C 48 27, 54 22, 60 22 Z" 
        fill="url(#neonVapor)" filter="url(#coreGlow)" opacity="0.95"/>

  <!-- Cyber Genie Core Ring / Energy Vortex -->
  <ellipse cx="60" cy="42" rx="14" ry="18" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <circle cx="60" cy="36" r="3.5" fill="#FFFFFF" filter="url(#coreGlow)"/>

  <!-- Sleek Modern Lamp Base & Spout -->
  <!-- Base Plate -->
  <path d="M 46 94 L 74 94 L 70 89 L 50 89 Z" fill="#312E81" stroke="#818CF8" stroke-width="1.2"/>
  
  <!-- Lamp Main Hull -->
  <path d="M 32 75 
           C 32 68, 42 63, 60 63 
           C 78 63, 88 68, 88 75 
           C 88 83, 76 89, 60 89 
           C 44 89, 32 83, 32 75 Z" 
        fill="url(#lampMetallic)" stroke="#A5B4FC" stroke-width="1.8" filter="url(#softGlow)"/>

  <!-- Sleek Lamp Handle -->
  <path d="M 38 70 
           C 22 64, 18 80, 30 84 
           C 25 79, 28 69, 38 72 Z" 
        fill="url(#neonVapor)" stroke="#6366F1" stroke-width="0.8"/>

  <!-- Sleek Modern Spout -->
  <path d="M 80 72 
           C 92 68, 102 58, 104 50 
           C 101 54, 94 60, 84 64 Z" 
        fill="url(#neonVapor)" stroke="#38BDF8" stroke-width="0.8"/>

  <!-- Metallic Highlight Rim -->
  <path d="M 40 73 C 48 70, 72 70, 80 73" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>

  <!-- 4-Point Futuristic AI Stars & Sparks -->
  <!-- Top Right Star -->
  <path d="M 88 28 L 90.5 34.5 L 97 37 L 90.5 39.5 L 88 46 L 85.5 39.5 L 79 37 L 85.5 34.5 Z" 
        fill="#F472B6" filter="url(#coreGlow)"/>
  
  <!-- Left Star -->
  <path d="M 28 42 L 30 46.5 L 35 48.5 L 30 50.5 L 28 55 L 26 50.5 L 21 48.5 L 26 46.5 Z" 
        fill="#38BDF8" filter="url(#coreGlow)"/>

  <!-- Tiny Sparkles -->
  <circle cx="98" cy="52" r="1.5" fill="#F472B6" filter="url(#softGlow)"/>
  <circle cx="24" cy="32" r="1.8" fill="#38BDF8" filter="url(#softGlow)"/>
  <circle cx="70" cy="18" r="1.2" fill="#FFFFFF" filter="url(#softGlow)"/>
</svg>